[project]
name = "vision_validation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "facenet-pytorch>=2.5.3",
    "imagehash>=4.3.2",
    "ipywidgets>=8.1.9",
    "jupyterlab-widgets>=3.0.17",
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "opencv-python-headless>=5.1.0.95",
    "pandas>=2.3.3",
    "questionary>=2.1.1",
    "scikit-learn>=1.7.2",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
